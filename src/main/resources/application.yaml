spring:
  application:
    name: stateless-auth-template

  profiles:
    default: dev

  jpa:
    show-sql: false

  cache:
    cache-names:
      - users

server:
  servlet:
    context-path: /api/v1

app:
  security:
    cookies:
      refresh-token-name: refreshToken
      session-token-name: sessionToken
      same-site-strategy: Strict
    jwt:
      refresh-expiry: 14d
      session-expiry: 15m

logging:
  level:
    root: INFO
    org:
      # Disables showing database information on startup
      hibernate.orm.connections.pooling: WARN
      # Prevent logger noise on malformed HTTP requests
      apache:
        catalina.connector.CoyoteAdapter: ERROR
        coyote.http11:
          Http11InputBuffer: ERROR
          Http11Processor: ERROR
        tomcat.util.http.parser.HttpParser: ERROR